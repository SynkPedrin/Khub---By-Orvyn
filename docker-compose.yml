# Infra local do Orvyn (F0-08). Requer Docker (não instalado nesta máquina).
#   docker compose up -d
#   export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/orvyn"
#   psql "$DATABASE_URL" -f db/000_foundation.sql ...  (ver db/README.md)
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: orvyn-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orvyn
    ports:
      - '5432:5432'
    volumes:
      - orvyn_pg:/var/lib/postgresql/data
      # Migrations aplicadas manualmente em ordem (ver db/README.md / scripts/db-apply.sh),
      # não via initdb.d — o auto-run ordena por nome e é frágil (001a antes de 001).
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d orvyn']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: orvyn-redis
    ports:
      - '6379:6379'
    volumes:
      - orvyn_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  orvyn_pg:
  orvyn_redis:
