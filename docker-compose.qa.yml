# Stack QA ISOLADA do KHUB (Sprint 0). Nomes, volume e portas exclusivos:
# não colide com orvyn-postgres/orvyn-redis (dev) nem com volumes existentes.
#   docker compose -p orvyn-qa -f docker-compose.qa.yml up -d
# Derrubar SÓ esta stack: docker compose -p orvyn-qa -f docker-compose.qa.yml stop
name: orvyn-qa
services:
  qa-postgres:
    image: pgvector/pgvector:pg16
    container_name: orvyn-qa-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: qa_postgres_local
      POSTGRES_DB: orvyn_qa
    ports: ['127.0.0.1:55440:5432']
    volumes: ['orvyn_qa_pg:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d orvyn_qa']
      interval: 5s
      timeout: 5s
      retries: 10
  qa-redis:
    image: redis:7-alpine
    container_name: orvyn-qa-redis
    ports: ['127.0.0.1:6395:6379']
    volumes: ['orvyn_qa_redis:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  orvyn_qa_pg:
  orvyn_qa_redis:
